name: Actualizar resultados

on:
  schedule:
    # Horas en UTC. República Dominicana = UTC-4 todo el año.
    # Cada corrida es 5 minutos después de la hora del sorteo.
    - cron: "5 16 * * *"   # 12:05 PM DR — La Primera, LoteDom
    - cron: "35 16 * * *"  # 12:35 PM DR — La Suerte
    - cron: "0 17 * * *"   # 1:00 PM DR — Real
    - cron: "35 17 * * *"  # 1:35 PM DR — Loteka Tarde
    - cron: "35 18 * * *"  # 2:35 PM DR — Gana Más
    - cron: "5 22 * * *"   # 6:05 PM DR — La Suerte Noche
    - cron: "5 23 * * *"   # 7:05 PM DR — La Primera Noche
    - cron: "55 23 * * *"  # 7:55 PM DR — Loteka
    - cron: "5 0 * * *"    # 8:05 PM DR — Real Noche
    - cron: "55 0 * * *"   # 8:55 PM DR — Leidsa
    - cron: "5 1 * * *"    # 9:05 PM DR — Nacional Noche
  workflow_dispatch:  # permite ejecutarlo manualmente desde GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar resultados y actualizar data.json
        run: python3 scripts/fetch_results.py
      - name: Publicar cambios si hay resultados nuevos
        run: |
          git config user.name "loteria-bot"
          git config user.email "loteria-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Resultados actualizados $(date -u +%Y-%m-%d\ %H:%M\ UTC)"
          git pull --rebase || true
          git push
